[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-model-local"
version = "0.1.0"
description = "Domain-isolated RAG model fine-tuning pipelines"
requires-python = ">=3.10"

[project.scripts]
aml = "aml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
